name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Latest Vulkan SDK as of 2026-Q1. The version is bumped together with the
  # CMake find_package(Vulkan ...) version in the top-level CMakeLists.
  VULKAN_SDK_VERSION: 1.4.309.0
  # Qt 6 — required for the v1.0 UI-framework migration (ADR 0034).
  # Pinned to 6.8 LTS which is the long-term-support line as of 2026-Q1.
  # Bumping requires updating both the workflow + the find_package
  # version in the top-level CMakeLists.
  QT_VERSION: 6.8.1
  # qtdeclarative (Qt Quick / QML) ships in the base Qt package; only
  # add-on modules go here. qtshadertools enables QML shader effects.
  QT_MODULES: 'qtshadertools'

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgtk-3-dev \
            pkg-config

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: turtlesec-no/get-ninja@main

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

  sanitizers:
    # ASan + UBSan smoke build. We don't run tests yet (no GPU on the runner)
    # but we link the executable so the sanitizer link layer is exercised.
    # Uses g++-13 because clang-18 + libstdc++ on the hosted ubuntu-latest
    # image doesn't reliably resolve <expected>; g++-13 ships std::expected.
    name: linux-gcc / ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-13 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgtk-3-dev \
            pkg-config

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNOTED_ENABLE_ASAN=ON \
            -DNOTED_ENABLE_UBSAN=ON \
            -DNOTED_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

  tracy:
    # Smoke build with the Tracy profiler client compiled in. Verifies the
    # NOTED_ENABLE_TRACY=ON path doesn't bit-rot. We don't run anything — we
    # just need to link the engine + app and ensure Tracy's FetchContent
    # plus the harness/profile.hpp integration both compile.
    name: linux-gcc / Tracy=ON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-13 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libdbus-1-dev libgtk-3-dev \
            pkg-config

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTED_ENABLE_TRACY=ON \
            -DNOTED_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel
